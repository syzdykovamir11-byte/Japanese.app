<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Кана: карточки</title>
  <meta name="description" content="Карточки для запоминания хираганы и катаканы.">
  <meta name="theme-color" content="#edeff7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f1e" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Тема применяется до первой отрисовки, чтобы не мигало. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('kana-theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Onest', 'system-ui', 'sans-serif'],
            display: ['Unbounded', 'Onest', 'system-ui', 'sans-serif'],
            kana: ['"Klee One"', '"Hiragino Mincho ProN"', '"Yu Mincho"', 'serif'],
          },
          colors: {
            bg: 'rgb(var(--bg) / <alpha-value>)',
            surface: 'rgb(var(--surface) / <alpha-value>)',
            surface2: 'rgb(var(--surface-2) / <alpha-value>)',
            ink: 'rgb(var(--ink) / <alpha-value>)',
            muted: 'rgb(var(--muted) / <alpha-value>)',
            line: 'rgb(var(--line) / <alpha-value>)',
            edge: 'rgb(var(--edge) / <alpha-value>)',
            primary: 'rgb(var(--primary) / <alpha-value>)',
            sakura: 'rgb(var(--sakura) / <alpha-value>)',
            bad: 'rgb(var(--bad-ink) / <alpha-value>)',
            hard: 'rgb(var(--hard-ink) / <alpha-value>)',
            good: 'rgb(var(--good-ink) / <alpha-value>)',
            easy: 'rgb(var(--easy-ink) / <alpha-value>)',
          },
        },
      },
    };
  </script>

  <style>
    /* ---------- Токены: «Ай-иро» (индиго) и сакура ---------- */
    :root {
      --bg: 237 239 247;
      --surface: 255 255 255;
      --surface-2: 226 229 243;
      --ink: 24 27 52;
      --muted: 95 100 134;
      --line: 218 222 238;
      --edge: 167 174 208;        /* край карточки: 2.2:1 к белому */
      --primary: 76 88 214;
      --sakura: 236 102 142;
      --flip-a: 76 88 214;
      --flip-b: 106 76 218;
      /* --x — заливки и графика, --x-ink — текст (≥ 4.5:1) */
      --bad: 225 72 77;    --bad-ink: 184 35 42;
      --hard: 230 145 20;  --hard-ink: 138 82 0;
      --good: 30 155 100;  --good-ink: 15 107 68;
      --easy: 14 150 220;  --easy-ink: 8 95 146;
      --shadow: 24 27 52;
      color-scheme: light;
    }
    .dark {
      --bg: 13 15 30;
      --surface: 26 29 52;
      --surface-2: 36 40 70;
      --ink: 236 238 255;
      --muted: 150 155 192;
      --line: 46 50 84;
      --edge: 74 80 132;
      --primary: 132 143 255;
      --sakura: 255 128 166;
      --flip-a: 70 80 205;
      --flip-b: 104 72 214;
      --bad: 255 102 108;  --bad-ink: 255 120 125;
      --hard: 252 178 64;  --hard-ink: 252 186 84;
      --good: 56 200 134;  --good-ink: 72 210 146;
      --easy: 64 190 250;  --easy-ink: 96 200 252;
      --shadow: 0 0 0;
      color-scheme: dark;
    }

    html, body { background: rgb(var(--bg)); }
    body { -webkit-tap-highlight-color: transparent; font-feature-settings: "ss01", "cv11"; }

    /* Мягкое свечение сверху. */
    body::before {
      content: '';
      position: fixed;
      inset: -20vh -20vw auto;
      height: 70vh;
      pointer-events: none;
      background:
        radial-gradient(40% 60% at 25% 30%, rgb(var(--primary) / .14), transparent 70%),
        radial-gradient(35% 50% at 80% 20%, rgb(var(--sakura) / .12), transparent 70%);
      z-index: 0;
    }

    /* Оттенки: компонент берёт цвет из --tone (графика) и --tone-ink (текст). */
    .tone-bad     { --tone: var(--bad);   --tone-ink: var(--bad-ink); }
    .tone-hard    { --tone: var(--hard);  --tone-ink: var(--hard-ink); }
    .tone-good    { --tone: var(--good);  --tone-ink: var(--good-ink); }
    .tone-easy    { --tone: var(--easy);  --tone-ink: var(--easy-ink); }
    .tone-muted   { --tone: var(--muted); --tone-ink: var(--muted); }
    .tone-primary { --tone: var(--primary); --tone-ink: var(--primary); }

    :focus-visible { outline: 2.5px solid rgb(var(--primary)); outline-offset: 2px; }

    /* ---------- Сегментированный переключатель ---------- */
    .seg {
      display: inline-flex;
      padding: 4px;
      gap: 2px;
      border-radius: 999px;
      background: rgb(var(--surface-2));
    }
    .seg button {
      min-height: 40px;
      padding: 0 .9rem;
      border-radius: 999px;
      font-size: .875rem;
      font-weight: 500;
      color: rgb(var(--muted));
      transition: background-color .15s ease, color .15s ease, box-shadow .15s ease;
      white-space: nowrap;
    }
    .seg button:hover { color: rgb(var(--ink)); }
    .seg button[aria-selected="true"], .seg button[aria-pressed="true"] {
      background: rgb(var(--surface));
      color: rgb(var(--ink));
      box-shadow: 0 1px 2px rgb(var(--shadow) / .14), 0 2px 8px -2px rgb(var(--shadow) / .14);
    }
    .seg-sm button { min-height: 36px; padding: 0 .75rem; font-size: .8125rem; }

    .icon-btn {
      position: relative;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 999px;
      color: rgb(var(--muted));
      transition: background-color .15s ease, color .15s ease;
    }
    .icon-btn:hover { background: rgb(var(--surface-2)); color: rgb(var(--ink)); }
    .icon-btn .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgb(var(--sakura));
      box-shadow: 0 0 0 2px rgb(var(--bg));
    }

    /* ---------- Карточка ---------- */
    .scene {
      width: min(100%, 26rem);
      height: clamp(22rem, calc(100dvh - 17rem), 35rem);
      perspective: 1600px;
    }
    .flip {
      position: relative;
      width: 100%;
      height: 100%;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.2, .7, .2, 1);
      cursor: pointer;
      border-radius: 2rem;
    }
    .flip.is-flipped { transform: rotateY(180deg); }
    .flip.no-anim { transition: none; }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 2rem;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      padding: 1.1rem;
      overflow: hidden;
      /* Safari иногда рисует вложенные слои сквозь backface-visibility.
         Поэтому неактивная сторона прячется на середине поворота (≈ 80 мс). */
      transition: visibility 0s linear .08s;
    }
    .front { transform: rotateY(0deg); }
    .flip.is-flipped .front,
    .flip:not(.is-flipped) .back { visibility: hidden; }
    .flip.no-anim .face { transition: none; }
    .front {
      background: rgb(var(--surface));
      border: 1.5px solid rgb(var(--edge));
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / .6),
        0 2px 4px rgb(var(--shadow) / .06),
        0 18px 40px -16px rgb(var(--shadow) / .32);
    }
    .dark .front { box-shadow: inset 0 1px 0 rgb(255 255 255 / .05), 0 18px 40px -16px rgb(0 0 0 / .7); }

    /* Клетка для прописей (как в японской тетради): рамка и пунктирный крест. */
    .genko {
      display: grid;
      place-items: center;
      width: 1.22em;
      height: 1.22em;
      font-size: clamp(7.5rem, min(52vw, 28vh), 14rem);
      border: 2px solid rgb(var(--primary) / .5);
      border-radius: .06em;
      /* Пунктирный крест рисуется фоном: без отдельных слоёв над знаком. */
      --guide: rgb(var(--primary) / .42);
      background-color: rgb(var(--primary) / .035);
      background-image:
        repeating-linear-gradient(to bottom, var(--guide) 0 6px, transparent 6px 12px),
        repeating-linear-gradient(to right,  var(--guide) 0 6px, transparent 6px 12px);
      background-size: 1.5px 100%, 100% 1.5px;
      background-position: center, center;
      background-repeat: no-repeat;
    }
    .glyph { line-height: 1; color: rgb(var(--ink)); font-weight: 600; }

    /* Оборот */
    .back {
      transform: rotateY(180deg);
      color: #fff;
      gap: .7rem;
      background:
        radial-gradient(90% 55% at 100% 0%, rgb(var(--sakura) / .38), transparent 62%),
        linear-gradient(155deg, rgb(var(--flip-a)), rgb(var(--flip-b)));
      box-shadow: 0 18px 40px -16px rgb(var(--flip-a) / .75);
      overflow-y: auto;
    }
    .back-static { position: relative; inset: auto; transform: none; overflow: visible; box-shadow: none; }
    .glass {
      border-radius: 1.25rem;
      background: rgb(255 255 255 / .13);
      border: 1px solid rgb(255 255 255 / .2);
      padding: .9rem 1rem;
    }
    .glass-label {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgb(255 255 255 / .9);
    }
    .glass-label svg { width: 14px; height: 14px; }
    .back mark {
      color: inherit;
      background: rgb(var(--sakura) / .45);
      border-radius: .22em;
      padding: 0 .08em;
      margin: 0 .02em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .sound-ring {
      display: grid;
      place-items: center;
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 1.25rem;
      background: rgb(255 255 255 / .15);
      border: 1px solid rgb(255 255 255 / .25);
      flex-shrink: 0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .3rem .65rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
      color: rgb(var(--tone-ink, var(--muted)));
      background: rgb(var(--tone, var(--muted)) / .12);
    }
    .chip::before { content: ''; width: .45rem; height: .45rem; border-radius: 999px; background: rgb(var(--tone, var(--muted))); }
    .chip.plain::before { display: none; }
    .chip.on-dark { color: #fff; background: rgb(255 255 255 / .16); }

    /* ---------- Кнопки оценки ---------- */
    .rate {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .1rem;
      min-height: 60px;
      padding: .5rem .25rem;
      border-radius: 1.1rem;
      font-weight: 600;
      color: rgb(var(--tone-ink));
      background: rgb(var(--tone) / .1);
      border: 1.5px solid rgb(var(--tone) / .35);
      transition: transform .12s ease, background-color .15s ease, color .15s ease, opacity .2s ease;
    }
    .rate small { font-size: .75rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    .rate:hover { background: rgb(var(--tone) / .18); }
    .rate:active, .rate.is-picked { transform: scale(.95); background: rgb(var(--tone)); border-color: rgb(var(--tone)); color: #fff; }
    .rate:disabled { opacity: .4; pointer-events: none; }
    .rate kbd { position: absolute; top: .35rem; right: .5rem; font: 600 .625rem/1 Onest, sans-serif; opacity: .6; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      min-height: 48px;
      padding: 0 1.2rem;
      border-radius: 1rem;
      font-weight: 600;
      transition: transform .12s ease, background-color .15s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: rgb(var(--primary)); color: #fff; }
    .dark .btn-primary { color: rgb(var(--bg)); }
    .btn-primary:hover { background: rgb(var(--primary) / .9); }
    .btn-soft { background: rgb(var(--surface-2)); color: rgb(var(--ink)); }
    .btn-soft:hover { background: rgb(var(--line)); }
    .btn:disabled { opacity: .45; pointer-events: none; }

    /* ---------- Фильтр ---------- */
    .row-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .15rem;
      min-height: 64px;
      border-radius: 1rem;
      border: 1.5px solid rgb(var(--line));
      background: rgb(var(--surface));
      color: rgb(var(--muted));
      transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .12s ease;
    }
    .row-chip .k { font-family: 'Klee One', serif; font-weight: 600; font-size: 1.6rem; line-height: 1; }
    .row-chip .r { font-size: .7rem; font-weight: 600; letter-spacing: .04em; }
    .row-chip[aria-pressed="true"] { border-color: rgb(var(--primary)); background: rgb(var(--primary) / .1); color: rgb(var(--ink)); }
    .row-chip[aria-pressed="true"] .r { color: rgb(var(--primary)); }
    .row-chip:active { transform: scale(.96); }

    .opt {
      display: flex;
      align-items: center;
      gap: .75rem;
      width: 100%;
      min-height: 56px;
      padding: .7rem .9rem;
      border-radius: 1rem;
      border: 1.5px solid rgb(var(--line));
      text-align: left;
      transition: border-color .15s ease, background-color .15s ease;
    }
    .opt .dot { width: 1.1rem; height: 1.1rem; border-radius: 999px; border: 2px solid rgb(var(--edge)); flex-shrink: 0; display: grid; place-items: center; }
    .opt[aria-checked="true"] { border-color: rgb(var(--primary)); background: rgb(var(--primary) / .08); }
    .opt[aria-checked="true"] .dot { border-color: rgb(var(--primary)); }
    .opt[aria-checked="true"] .dot::after { content: ''; width: .5rem; height: .5rem; border-radius: 999px; background: rgb(var(--primary)); }

    /* ---------- Ввод ---------- */
    .type-card {
      border: 1.5px solid rgb(var(--edge));
      transition: border-color .2s ease, background-color .2s ease, box-shadow .3s ease;
      box-shadow: 0 2px 4px rgb(var(--shadow) / .06), 0 18px 40px -16px rgb(var(--shadow) / .32);
    }
    .type-card.is-ok  { border-color: rgb(var(--good)); background: rgb(var(--good) / .1); box-shadow: 0 0 0 8px rgb(var(--good) / .12), 0 18px 40px -16px rgb(var(--good) / .5); }
    .type-card.is-bad { border-color: rgb(var(--bad));  background: rgb(var(--bad) / .08); }
    .type-card.is-ok  .glyph { color: rgb(var(--good-ink)); }
    .type-card.is-bad .glyph { color: rgb(var(--bad-ink)); }
    .type-card.is-ok .genko, .type-card.is-bad .genko { border-color: transparent; background: none; }
    .answer-input { transition: border-color .15s ease, box-shadow .15s ease, color .15s ease; border: 2px solid rgb(var(--edge)); }
    .answer-input:focus { outline: none; border-color: rgb(var(--primary)); box-shadow: 0 0 0 4px rgb(var(--primary) / .2); }
    .answer-input.is-ok  { border-color: rgb(var(--good)); box-shadow: 0 0 0 4px rgb(var(--good) / .2); color: rgb(var(--good-ink)); }
    .answer-input.is-bad { border-color: rgb(var(--bad));  box-shadow: 0 0 0 4px rgb(var(--bad) / .2);  color: rgb(var(--bad-ink)); text-decoration: line-through; text-decoration-thickness: 2px; }

    kbd.key {
      font: 600 .7rem/1 Onest, sans-serif;
      padding: .2rem .4rem;
      border-radius: .35rem;
      border: 1px solid rgb(var(--edge));
      background: rgb(var(--surface));
      color: rgb(var(--muted));
    }

    /* ---------- Прогресс ---------- */
    .panel { border-radius: 1.5rem; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); padding: 1rem; }
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .1rem;
      aspect-ratio: 1;
      border-radius: .9rem;
      background: rgb(var(--tone) / .14);
      color: rgb(var(--ink));
      transition: transform .12s ease, background-color .15s ease;
    }
    .tile:hover { background: rgb(var(--tone) / .24); }
    .tile:active { transform: scale(.95); }
    .tile.tone-muted { background: rgb(var(--surface)); border: 1px solid rgb(var(--line)); }
    .tile .k { font-family: 'Klee One', serif; font-weight: 600; font-size: clamp(1.35rem, 6vw, 1.9rem); line-height: 1; }
    .tile .r { font-size: .6875rem; color: rgb(var(--muted)); }
    .tile .dot { position: absolute; top: .4rem; right: .4rem; width: .45rem; height: .45rem; border-radius: 999px; background: rgb(var(--tone)); }
    .tile.tone-muted .dot { display: none; }
    .meter { height: .5rem; border-radius: 999px; background: rgb(var(--surface-2)); overflow: hidden; }
    .meter > span { display: block; height: 100%; border-radius: inherit; background: rgb(var(--tone)); transition: width .4s ease; }

    /* ---------- Шторка ---------- */
    .sheet-wrap { position: fixed; inset: 0; z-index: 40; display: grid; align-items: end; justify-items: center; }
    .sheet-wrap[hidden] { display: none; }
    .sheet-scrim { position: absolute; inset: 0; background: rgb(var(--shadow) / .45); animation: fade .2s ease; }
    .dark .sheet-scrim { background: rgb(0 0 0 / .6); }
    .sheet {
      position: relative;
      width: min(100%, 30rem);
      max-height: 92dvh;
      overflow-y: auto;
      border-radius: 1.75rem 1.75rem 0 0;
      background: rgb(var(--surface));
      padding: .75rem 1rem max(1rem, env(safe-area-inset-bottom));
      animation: sheet-up .28s cubic-bezier(.2, .7, .2, 1);
    }
    @media (min-width: 640px) {
      .sheet-wrap { align-items: center; }
      .sheet { border-radius: 1.75rem; padding-bottom: 1rem; }
    }

    /* ---------- Эффекты ---------- */
    #fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
    .petal {
      position: absolute;
      width: var(--s, 10px);
      height: calc(var(--s, 10px) * 1.3);
      border-radius: 0 100% 0 100%;
      background: rgb(var(--c));
      animation: petal var(--d, 1s) cubic-bezier(.15, .6, .3, 1) forwards;
      will-change: transform, opacity;
    }
    .petal.spark { border-radius: 999px; width: calc(var(--s) * .55); height: calc(var(--s) * .55); }
    @keyframes petal {
      0%   { transform: translate(-50%, -50%) rotate(0) scale(.3); opacity: 0; }
      12%  { opacity: 1; }
      70%  { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)) scale(1); opacity: 0; }
    }
    .plus-one {
      position: absolute;
      font: 700 1.1rem/1 Unbounded, sans-serif;
      color: rgb(var(--good-ink));
      animation: plus 900ms ease-out forwards;
    }
    @keyframes plus { from { transform: translate(-50%, 0); opacity: 0; } 20% { opacity: 1; } to { transform: translate(-50%, -48px); opacity: 0; } }

    .toast {
      position: fixed;
      left: 50%;
      top: max(9.5rem, calc(env(safe-area-inset-top) + 9rem));
      z-index: 60;
      transform: translateX(-50%);
      padding: .7rem 1.1rem;
      border-radius: 999px;
      background: rgb(var(--ink));
      color: rgb(var(--bg));
      font-weight: 600;
      box-shadow: 0 12px 30px -10px rgb(var(--shadow) / .5);
      animation: toast 1.8s cubic-bezier(.2, .7, .2, 1) forwards;
      white-space: nowrap;
    }
    @keyframes toast {
      0% { opacity: 0; transform: translate(-50%, -12px) scale(.9); }
      12% { opacity: 1; transform: translate(-50%, 0) scale(1.04); }
      20% { transform: translate(-50%, 0) scale(1); }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -6px); }
    }

    /* Уход карточки после оценки */
    .exit-bad  { animation: exit-bad  .26s ease-in forwards; }
    .exit-hard { animation: exit-hard .26s ease-in forwards; }
    .exit-good { animation: exit-good .26s ease-in forwards; }
    .exit-easy { animation: exit-easy .3s ease-in forwards; }
    @keyframes exit-bad  { 30% { transform: translateX(10px); } to { transform: translateX(-115%) rotate(-10deg); opacity: 0; } }
    @keyframes exit-hard { to { transform: translateY(-36px) scale(.94); opacity: 0; } }
    @keyframes exit-good { to { transform: translateX(115%) rotate(9deg); opacity: 0; } }
    @keyframes exit-easy { 25% { transform: scale(1.04); } to { transform: translate(115%, -18%) rotate(16deg); opacity: 0; } }

    @keyframes fade { from { opacity: 0; } }
    @keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } }
    @keyframes card-in { from { opacity: 0; transform: translateY(16px) scale(.97); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(6px); } }
    @keyframes pop   { 35% { transform: scale(1.08); } 65% { transform: scale(.98); } }
    @keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
    @keyframes bump  { 50% { transform: scale(1.35); } }
    .anim-card-in { animation: card-in .32s cubic-bezier(.2, .7, .2, 1); }
    .anim-rise  { animation: rise .18s ease-out; }
    .anim-pop   { animation: pop .38s cubic-bezier(.3, .7, .3, 1.4); }
    .anim-shake { animation: shake .35s ease-out; }
    .anim-bump  { animation: bump .3s ease-out; display: inline-block; }

    @media (prefers-reduced-motion: reduce) {
      .flip, .face { transition: none; }
      .anim-card-in, .anim-rise, .anim-pop, .anim-shake, .anim-bump, .sheet, .sheet-scrim,
      .exit-bad, .exit-hard, .exit-good, .exit-easy { animation: none; }
      .toast { animation: none; }
    }
  </style>
</head>

<body class="font-sans text-ink antialiased min-h-[100dvh] selection:bg-primary/25">
  <div class="relative z-10 mx-auto flex min-h-[100dvh] w-full max-w-xl flex-col px-4">

    <!-- Шапка -->
    <header class="flex items-center gap-1 pt-[max(.6rem,env(safe-area-inset-top))] pb-1.5">
      <span class="font-kana whitespace-nowrap text-[1.6rem] font-semibold text-primary select-none" lang="ja" aria-hidden="true">かな</span>
      <nav class="seg mx-auto" role="tablist" aria-label="Разделы">
        <button type="button" role="tab" id="tab-cards" aria-controls="view-cards" data-tab="cards">Карточки</button>
        <button type="button" role="tab" id="tab-type" aria-controls="view-type" data-tab="type">Ввод</button>
        <button type="button" role="tab" id="tab-progress" aria-controls="view-progress" data-tab="progress">Прогресс</button>
      </nav>
      <button id="themeBtn" type="button" class="icon-btn" aria-label="Сменить тему">
        <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <!-- Азбука и фильтр -->
    <div class="flex items-center justify-center gap-2 py-1">
      <div class="seg seg-sm" id="scriptSeg" role="group" aria-label="Азбука">
        <button type="button" data-script="hiragana"><span class="font-kana font-semibold" lang="ja">あ</span> Хирагана</button>
        <button type="button" data-script="katakana"><span class="font-kana font-semibold" lang="ja">ア</span> Катакана</button>
        <button type="button" data-script="both">Обе</button>
      </div>
      <button id="filterBtn" type="button" class="icon-btn" aria-haspopup="dialog">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span id="filterBadge" class="badge" hidden></span>
      </button>
    </div>

    <!-- ===== Карточки ===== -->
    <section id="view-cards" class="hidden flex-1 flex-col" role="tabpanel" aria-labelledby="tab-cards">
      <div id="cardsInfo" class="flex min-h-[2.5rem] items-center justify-between gap-3 text-sm"></div>

      <div class="flex flex-1 flex-col items-center justify-center py-1.5">
        <div id="scene" class="scene">
          <div id="flashcard" class="flip" role="button" tabindex="0" aria-describedby="flipHint">
            <div id="front" class="face front"></div>
            <div id="back" class="face back" aria-live="polite"></div>
          </div>
        </div>
        <div id="doneBox" class="hidden w-full max-w-sm flex-col items-center text-center"></div>
      </div>
      <p id="flipHint" class="sr-only">Пробел или Enter — перевернуть. Клавиши 1–4 — оценка.</p>

      <div id="rateBar" class="grid grid-cols-4 gap-2 pb-[max(1rem,env(safe-area-inset-bottom))] pt-2" role="group" aria-label="Насколько легко вспомнилось"></div>
    </section>

    <!-- ===== Ввод ===== -->
    <section id="view-type" class="hidden flex-1 flex-col items-center" role="tabpanel" aria-labelledby="tab-type">
      <div id="typeInfo" class="flex min-h-[2.5rem] w-full items-center justify-between gap-3 text-sm tabular-nums">
        <span id="typeFilter" class="text-muted"></span>
        <span class="flex items-center gap-4">
          <span class="text-muted">серия <b id="tStreak" class="font-display font-semibold text-ink">0</b></span>
          <span class="text-muted">рекорд <b id="tBest" class="font-display font-semibold text-ink">0</b></span>
          <span class="hidden text-muted sm:inline">точность <b id="tAcc" class="font-display font-semibold text-ink">–</b></span>
        </span>
      </div>

      <div id="typeStage" class="flex w-full flex-1 flex-col items-center justify-center pb-14">
        <div id="typeCard" class="type-card grid h-[15.5rem] w-[15.5rem] place-items-center rounded-[2rem] bg-surface sm:h-[17rem] sm:w-[17rem]">
          <div class="genko" style="font-size:clamp(6.5rem,30vw,9.5rem)"><span id="typeKana" class="glyph font-kana select-none" lang="ja"></span></div>
        </div>
        <p id="typeTag" class="mt-3 h-4 text-xs font-medium text-muted"></p>

        <input id="answer" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go"
          maxlength="6" aria-label="Введите ромадзи" placeholder="ромадзи"
          class="answer-input mt-5 w-64 rounded-2xl bg-surface px-5 py-3 text-center font-display text-[1.6rem] font-semibold tracking-wide placeholder:font-sans placeholder:font-normal placeholder:text-muted/60">

        <div id="typeFeedback" class="mt-4 flex h-24 flex-col items-center justify-start text-center" aria-live="polite"></div>
      </div>
    </section>

    <!-- ===== Прогресс ===== -->
    <section id="view-progress" class="hidden flex-1 flex-col gap-4 pb-10 pt-2" role="tabpanel" aria-labelledby="tab-progress">
      <div id="statTiles" class="grid grid-cols-3 gap-2"></div>

      <div class="panel">
        <div id="levelBar" class="flex h-3 overflow-hidden rounded-full bg-surface2"></div>
        <div id="levelLegend" class="mt-3 flex flex-wrap gap-x-4 gap-y-1.5 text-xs text-muted"></div>
      </div>

      <div class="panel">
        <div class="flex items-baseline justify-between">
          <h2 class="font-display text-[.95rem] font-semibold">Труднее всего</h2>
          <span class="text-xs text-muted">по последним оценкам</span>
        </div>
        <ul id="weakList" class="mt-3 flex flex-col gap-1"></ul>
        <button id="weakBtn" type="button" class="btn btn-primary mt-3 w-full"></button>
      </div>

      <div id="grids" class="flex flex-col gap-4"></div>

      <button id="resetBtn" type="button" class="mx-auto min-h-[44px] px-3 text-sm text-muted underline-offset-4 hover:text-bad hover:underline">Сбросить прогресс</button>
    </section>
  </div>

  <!-- Шторка: подробности знака и фильтр -->
  <div id="sheet" class="sheet-wrap" hidden>
    <div class="sheet-scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="mx-auto mb-3 h-1.5 w-10 rounded-full bg-line" aria-hidden="true"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="fx" aria-hidden="true"></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
