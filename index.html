<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Кана: карточки</title>
  <meta name="description" content="Карточки для запоминания хираганы и катаканы.">
  <meta name="theme-color" content="#f3f4fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f1e" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">

  <!-- Тема применяется до первой отрисовки, чтобы не мигало. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('kana-theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Onest', 'system-ui', 'sans-serif'],
            kana: ['"Klee One"', '"Hiragino Mincho ProN"', '"Yu Mincho"', 'serif'],
          },
          colors: {
            bg: 'rgb(var(--bg) / <alpha-value>)',
            surface: 'rgb(var(--surface) / <alpha-value>)',
            surface2: 'rgb(var(--surface-2) / <alpha-value>)',
            ink: 'rgb(var(--ink) / <alpha-value>)',
            muted: 'rgb(var(--muted) / <alpha-value>)',
            line: 'rgb(var(--line) / <alpha-value>)',
            primary: 'rgb(var(--primary) / <alpha-value>)',
            sakura: 'rgb(var(--sakura) / <alpha-value>)',
            bad: 'rgb(var(--bad) / <alpha-value>)',
            hard: 'rgb(var(--hard) / <alpha-value>)',
            good: 'rgb(var(--good) / <alpha-value>)',
            easy: 'rgb(var(--easy) / <alpha-value>)',
          },
        },
      },
    };
  </script>

  <style>
    /* ---------- Токены: «Ай-иро» (индиго) и сакура ---------- */
    :root {
      --bg: 243 244 250;
      --surface: 255 255 255;
      --surface-2: 234 236 247;
      --ink: 24 27 52;
      --muted: 103 108 140;
      --line: 222 225 240;
      --primary: 76 88 214;
      --sakura: 236 102 142;
      --flip-a: 76 88 214;
      --flip-b: 126 92 240;
      --bad: 225 72 77;
      --hard: 230 145 20;
      --good: 30 155 100;
      --easy: 14 150 220;
      --shadow: 24 27 52;
      color-scheme: light;
    }
    .dark {
      --bg: 13 15 30;
      --surface: 24 27 48;
      --surface-2: 34 38 66;
      --ink: 236 238 255;
      --muted: 142 147 186;
      --line: 46 50 82;
      --primary: 132 143 255;
      --sakura: 255 128 166;
      --flip-a: 70 80 205;
      --flip-b: 112 80 225;
      --bad: 255 102 108;
      --hard: 252 178 64;
      --good: 56 200 134;
      --easy: 64 190 250;
      --shadow: 0 0 0;
      color-scheme: dark;
    }

    html, body { background: rgb(var(--bg)); }
    body { -webkit-tap-highlight-color: transparent; }

    /* Мягкое свечение сверху, без текстур. */
    body::before {
      content: '';
      position: fixed;
      inset: -20vh -20vw auto;
      height: 70vh;
      pointer-events: none;
      background:
        radial-gradient(40% 60% at 25% 30%, rgb(var(--primary) / .14), transparent 70%),
        radial-gradient(35% 50% at 80% 20%, rgb(var(--sakura) / .12), transparent 70%);
      z-index: 0;
    }

    /* Оттенки: компонент берёт цвет из --tone. */
    .tone-bad  { --tone: var(--bad); }
    .tone-hard { --tone: var(--hard); }
    .tone-good { --tone: var(--good); }
    .tone-easy { --tone: var(--easy); }
    .tone-muted { --tone: var(--muted); }
    .tone-primary { --tone: var(--primary); }

    /* ---------- Сегментированный переключатель ---------- */
    .seg {
      display: inline-flex;
      padding: 4px;
      gap: 2px;
      border-radius: 999px;
      background: rgb(var(--surface-2));
    }
    .seg button {
      padding: .45rem .85rem;
      border-radius: 999px;
      font-size: .875rem;
      font-weight: 500;
      color: rgb(var(--muted));
      transition: background-color .15s ease, color .15s ease, box-shadow .15s ease;
      white-space: nowrap;
    }
    .seg button:hover { color: rgb(var(--ink)); }
    .seg button[aria-selected="true"], .seg button[aria-pressed="true"] {
      background: rgb(var(--surface));
      color: rgb(var(--ink));
      box-shadow: 0 1px 2px rgb(var(--shadow) / .12), 0 2px 8px -2px rgb(var(--shadow) / .12);
    }
    .seg-sm button { padding: .35rem .75rem; font-size: .8125rem; }

    :focus-visible { outline: 2px solid rgb(var(--primary)); outline-offset: 2px; }

    /* ---------- Карточка с переворотом ---------- */
    .scene {
      width: min(100%, 26rem);
      height: clamp(21rem, calc(100dvh - 16rem), 34rem);
      perspective: 1600px;
    }
    .flip {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.2, .7, .2, 1);
      cursor: pointer;
      border-radius: 2rem;
    }
    .flip.is-flipped { transform: rotateY(180deg); }
    .flip.no-anim { transition: none; }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 2rem;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1.25rem 1.1rem;
      overflow: hidden;
    }
    .front {
      background: rgb(var(--surface));
      border: 1px solid rgb(var(--line));
      box-shadow: 0 1px 0 rgb(var(--line)), 0 30px 60px -30px rgb(var(--shadow) / .35);
    }
    .back {
      transform: rotateY(180deg);
      color: #fff;
      background:
        radial-gradient(80% 60% at 100% 0%, rgb(var(--sakura) / .35), transparent 60%),
        linear-gradient(150deg, rgb(var(--flip-a)), rgb(var(--flip-b)));
      box-shadow: 0 30px 60px -30px rgb(var(--flip-a) / .7);
      overflow-y: auto;
    }
    /* Та же обратная сторона, но в шторке: без 3D и абсолютного позиционирования. */
    .back-static { position: relative; inset: auto; transform: none; overflow: visible; box-shadow: none; }

    /* Клетка для прописей за знаком: показывает пропорции. */
    .glyph-box {
      position: relative;
      display: grid;
      place-items: center;
      width: 1.2em;
      height: 1.2em;
      font-size: clamp(8rem, min(56vw, 30vh), 15rem);
      border-radius: .08em;
    }
    .glyph-box::before, .glyph-box::after {
      content: '';
      position: absolute;
      border-color: rgb(var(--line));
      border-style: dashed;
    }
    .glyph-box::before { left: 50%; top: 4%; bottom: 4%; border-left-width: 2px; }
    .glyph-box::after  { top: 50%; left: 4%; right: 4%; border-top-width: 2px; }
    .glyph { position: relative; line-height: 1; color: rgb(var(--ink)); }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .25rem .6rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 500;
      color: rgb(var(--tone, var(--muted)));
      background: rgb(var(--tone, var(--muted)) / .12);
    }
    .chip::before {
      content: '';
      width: .4rem;
      height: .4rem;
      border-radius: 999px;
      background: currentColor;
    }
    .chip.plain::before { display: none; }

    .back mark { background: rgb(255 255 255 / .22); color: inherit; border-radius: .2em; padding: 0 .06em; }
    .label { font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; opacity: .7; }

    /* ---------- Кнопки оценки ---------- */
    .rate {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .1rem;
      padding: .7rem .25rem .6rem;
      border-radius: 1.1rem;
      font-weight: 600;
      color: rgb(var(--tone));
      background: rgb(var(--tone) / .12);
      border: 1px solid rgb(var(--tone) / .22);
      transition: transform .12s ease, background-color .15s ease, color .15s ease, opacity .2s ease;
    }
    .rate small { font-size: .72rem; font-weight: 500; opacity: .75; font-variant-numeric: tabular-nums; }
    .rate:hover { background: rgb(var(--tone) / .2); }
    .rate:active { transform: scale(.96); background: rgb(var(--tone)); color: #fff; }
    .rate:disabled { opacity: .35; pointer-events: none; }
    .rate kbd {
      position: absolute;
      top: .35rem;
      right: .45rem;
      font: 500 .625rem/1 Onest, sans-serif;
      opacity: .55;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .8rem 1.2rem;
      border-radius: 1rem;
      font-weight: 600;
      transition: transform .12s ease, background-color .15s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: rgb(var(--primary)); color: #fff; }
    .dark .btn-primary { color: rgb(var(--bg)); }
    .btn-primary:hover { background: rgb(var(--primary) / .9); }
    .btn-soft { background: rgb(var(--surface-2)); color: rgb(var(--ink)); }
    .btn-soft:hover { background: rgb(var(--line)); }
    .btn:disabled { opacity: .45; pointer-events: none; }

    /* ---------- Ввод ---------- */
    .type-card {
      transition: border-color .2s ease, background-color .2s ease;
      box-shadow: 0 30px 60px -30px rgb(var(--shadow) / .35);
    }
    .type-card.is-ok  { border-color: rgb(var(--good)); background: rgb(var(--good) / .1); }
    .type-card.is-bad { border-color: rgb(var(--bad));  background: rgb(var(--bad) / .1); }
    .type-card.is-ok  .glyph { color: rgb(var(--good)); }
    .type-card.is-bad .glyph { color: rgb(var(--bad)); }
    .answer-input { transition: border-color .15s ease, box-shadow .15s ease, color .15s ease; }
    .answer-input:focus { outline: none; border-color: rgb(var(--primary)); box-shadow: 0 0 0 4px rgb(var(--primary) / .18); }
    .answer-input.is-ok  { border-color: rgb(var(--good)); box-shadow: 0 0 0 4px rgb(var(--good) / .18); color: rgb(var(--good)); }
    .answer-input.is-bad { border-color: rgb(var(--bad));  box-shadow: 0 0 0 4px rgb(var(--bad) / .18);  color: rgb(var(--bad)); text-decoration: line-through; text-decoration-thickness: 2px; }

    kbd.key {
      font: 500 .7rem/1 Onest, sans-serif;
      padding: .2rem .4rem;
      border-radius: .35rem;
      border: 1px solid rgb(var(--line));
      background: rgb(var(--surface));
      color: rgb(var(--muted));
    }

    /* ---------- Прогресс ---------- */
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .1rem;
      aspect-ratio: 1;
      border-radius: .9rem;
      background: rgb(var(--tone) / .12);
      color: rgb(var(--ink));
      transition: transform .12s ease, background-color .15s ease;
    }
    .tile:hover { background: rgb(var(--tone) / .22); }
    .tile:active { transform: scale(.95); }
    .tile.tone-muted { background: rgb(var(--surface)); border: 1px solid rgb(var(--line)); }
    .tile .k { font-family: 'Klee One', serif; font-size: clamp(1.35rem, 6vw, 1.9rem); line-height: 1; }
    .tile .r { font-size: .6875rem; color: rgb(var(--muted)); }
    .tile .dot { position: absolute; top: .4rem; right: .4rem; width: .4rem; height: .4rem; border-radius: 999px; background: rgb(var(--tone)); }
    .tile.tone-muted .dot { display: none; }

    .meter { height: .5rem; border-radius: 999px; background: rgb(var(--surface-2)); overflow: hidden; }
    .meter > span { display: block; height: 100%; border-radius: inherit; background: rgb(var(--tone)); }

    /* ---------- Нижняя шторка ---------- */
    .sheet-wrap { position: fixed; inset: 0; z-index: 40; display: grid; align-items: end; justify-items: center; }
    .sheet-wrap[hidden] { display: none; }
    .sheet-scrim { position: absolute; inset: 0; background: rgb(var(--shadow) / .45); animation: fade .2s ease; }
    .sheet {
      position: relative;
      width: min(100%, 30rem);
      max-height: 90dvh;
      overflow-y: auto;
      border-radius: 1.75rem 1.75rem 0 0;
      background: rgb(var(--surface));
      padding: .75rem 1rem max(1rem, env(safe-area-inset-bottom));
      animation: sheet-up .28s cubic-bezier(.2, .7, .2, 1);
    }
    @media (min-width: 640px) {
      .sheet-wrap { align-items: center; }
      .sheet { border-radius: 1.75rem; padding-bottom: 1rem; }
    }

    @keyframes fade { from { opacity: 0; } }
    @keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } }
    @keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(.98); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(6px); } }
    @keyframes pop   { 40% { transform: scale(1.05); } }
    @keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
    @keyframes bump  { 50% { transform: scale(1.25); } }
    .anim-card-in { animation: card-in .3s cubic-bezier(.2, .7, .2, 1); }
    .anim-rise  { animation: rise .18s ease-out; }
    .anim-pop   { animation: pop .3s ease-out; }
    .anim-shake { animation: shake .35s ease-out; }
    .anim-bump  { animation: bump .25s ease-out; display: inline-block; }

    @media (prefers-reduced-motion: reduce) {
      .flip { transition: none; }
      .anim-card-in, .anim-rise, .anim-pop, .anim-shake, .anim-bump, .sheet, .sheet-scrim { animation: none; }
    }
  </style>
</head>

<body class="font-sans text-ink antialiased min-h-[100dvh] selection:bg-primary/25">
  <div class="relative z-10 mx-auto flex min-h-[100dvh] w-full max-w-xl flex-col px-4">

    <!-- Шапка: логотип, вкладки, тема -->
    <header class="flex items-center gap-2 pt-[max(.75rem,env(safe-area-inset-top))] pb-2">
      <span class="font-kana text-2xl text-primary select-none whitespace-nowrap" lang="ja" aria-hidden="true">かな</span>
      <nav class="seg mx-auto" role="tablist" aria-label="Разделы">
        <button type="button" role="tab" data-tab="cards">Карточки</button>
        <button type="button" role="tab" data-tab="type">Ввод</button>
        <button type="button" role="tab" data-tab="progress">Прогресс</button>
      </nav>
      <button id="themeBtn" type="button" aria-label="Сменить тему"
        class="grid h-10 w-10 shrink-0 place-items-center rounded-full text-muted transition hover:bg-surface2 hover:text-ink">
        <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <!-- Выбор азбуки, общий для всех вкладок -->
    <div class="flex justify-center py-1.5">
      <div class="seg seg-sm" id="scriptSeg" aria-label="Азбука">
        <button type="button" data-script="hiragana"><span class="font-kana" lang="ja">あ</span> Хирагана</button>
        <button type="button" data-script="katakana"><span class="font-kana" lang="ja">ア</span> Катакана</button>
        <button type="button" data-script="both">Обе</button>
      </div>
    </div>

    <!-- ===== Карточки ===== -->
    <section id="view-cards" class="hidden flex-1 flex-col" role="tabpanel">
      <div id="cardsInfo" class="flex min-h-[2.25rem] items-center justify-center gap-3 text-sm"></div>

      <div class="flex flex-1 flex-col items-center justify-center py-2">
        <div id="scene" class="scene">
          <div id="flashcard" class="flip" role="button" tabindex="0" aria-label="Перевернуть карточку">
            <div id="front" class="face front"></div>
            <div id="back" class="face back" aria-live="polite"></div>
          </div>
        </div>
        <div id="doneBox" class="hidden w-full max-w-sm flex-col items-center text-center"></div>
      </div>

      <div id="rateBar" class="grid grid-cols-4 gap-2 pb-[max(1rem,env(safe-area-inset-bottom))] pt-2"></div>
    </section>

    <!-- ===== Ввод ===== -->
    <section id="view-type" class="hidden flex-1 flex-col items-center" role="tabpanel">
      <div id="typeInfo" class="flex min-h-[2.25rem] items-center justify-center gap-5 text-sm tabular-nums">
        <span class="text-muted">серия <b id="tStreak" class="font-semibold text-ink">0</b></span>
        <span class="text-muted">рекорд <b id="tBest" class="font-semibold text-ink">0</b></span>
        <span class="text-muted">точность <b id="tAcc" class="font-semibold text-ink">–</b></span>
      </div>

      <div id="typeStage" class="flex w-full flex-1 flex-col items-center justify-center pb-16">
        <div id="typeCard" class="type-card grid h-[15rem] w-[15rem] place-items-center rounded-[2rem] border-2 border-line bg-surface sm:h-[17rem] sm:w-[17rem]">
          <span id="typeKana" class="glyph font-kana select-none text-[clamp(7rem,32vw,10.5rem)]" lang="ja"></span>
        </div>
        <p id="typeTag" class="mt-3 h-4 text-xs text-muted"></p>

        <input id="answer" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go"
          maxlength="6" aria-label="Введите ромадзи" placeholder="ромадзи"
          class="answer-input mt-5 w-64 rounded-2xl border-2 border-line bg-surface px-5 py-3 text-center text-[1.75rem] font-medium tracking-wide placeholder:font-normal placeholder:text-muted/50">

        <div id="typeFeedback" class="mt-4 flex h-24 flex-col items-center justify-start text-center" aria-live="polite"></div>
      </div>
    </section>

    <!-- ===== Прогресс ===== -->
    <section id="view-progress" class="hidden flex-1 flex-col gap-5 pb-10 pt-2" role="tabpanel">
      <div id="statTiles" class="grid grid-cols-3 gap-2"></div>

      <div class="rounded-3xl border border-line bg-surface p-4">
        <div id="levelBar" class="flex h-3 overflow-hidden rounded-full bg-surface2"></div>
        <div id="levelLegend" class="mt-3 flex flex-wrap gap-x-4 gap-y-1.5 text-xs text-muted"></div>
      </div>

      <div class="rounded-3xl border border-line bg-surface p-4">
        <div class="flex items-baseline justify-between">
          <h2 class="font-semibold">Труднее всего</h2>
          <span class="text-xs text-muted">по последним оценкам</span>
        </div>
        <ul id="weakList" class="mt-3 flex flex-col gap-2.5"></ul>
        <button id="weakBtn" type="button" class="btn btn-primary mt-4 w-full"></button>
      </div>

      <div id="grids" class="flex flex-col gap-5"></div>

      <button id="resetBtn" type="button" class="mx-auto text-sm text-muted underline-offset-4 hover:text-bad hover:underline">Сбросить прогресс</button>
    </section>
  </div>

  <!-- Шторка с подробностями знака -->
  <div id="sheet" class="sheet-wrap" hidden>
    <div class="sheet-scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="mx-auto mb-3 h-1.5 w-10 rounded-full bg-line"></div>
      <div id="sheetBody"></div>
      <button type="button" class="btn btn-soft mt-3 w-full" data-close>Закрыть</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
